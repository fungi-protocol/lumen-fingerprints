name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The public site is ONLY the Fingerprint Explorer (self-contained HTML +
      # its data file). The mdbook study stays local-only (`nix run .#serve`).
      - name: Assemble site (explorer only)
        run: |
          mkdir -p site
          cp docs/src/fingerprint-explorer.html site/index.html
          cp docs/src/fingerprint-explorer.html site/fingerprint-explorer.html
          cp docs/src/explorer-data.json site/explorer-data.json
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
