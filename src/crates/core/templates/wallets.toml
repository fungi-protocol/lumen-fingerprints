                                  # never call .nlocktime()) or ldk-node's own explicit
                                  # current-height nlocktime (create_funding_transaction,
                                  # :466, fed from event.rs:701-703's channel-funding path)
                                  # applies — both land in the same branch. Flips to "Rbf"
