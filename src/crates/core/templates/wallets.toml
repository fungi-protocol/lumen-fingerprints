# Wallet fingerprint templates. An omitted axis matches anything.
# confidence: "chain-proven" (decoded from a real txid) or "code-predicted" (read from source).
# Wallet developers: correct your own entry by PR — that is the point of this file.
#
# Wallet names deliberately match the `name` strings used by
# https://github.com/arminsabouri/walletfingerprints.info's fingerprints.json, so the two
# datasets join by identity. Do not rename an entry here without renaming it there too.
#
# Sources: fingerprints.json (generated_at 2026-06-29) and the research thread it draws
# from, payjoin/rust-payjoin#1597. Per-wallet comments cite the software version
# fingerprints.json recorded for that entry. Where the two sources give irreconcilable
# values for the same axis, the axis is left unset (never guessed) and the disagreement
# is recorded in a CONFLICT comment on that entry.
#
# Era fields: `software` + `from_version`/`until_version` scope an entry to the
# version interval [from, until) of that codebase; either bound may be omitted
# (missing until = era still current). Version strings are opaque labels — code
# never orders them. Multiple entries per wallet name = multiple eras.

[[wallet]]
name = "payjoin-cli"
software = "payjoin-cli"
from_version = "payjoin-cli-0.0.1-alpha"  # first tagged release; archaeology (Task 6)
# axes inherited from Bitcoin Core's walletcreatefundedpsbt — Core-side version
# cuts live on the "Bitcoin Core" entry; this entry's interval only says which
# payjoin-cli releases exist at all
confidence = "code-predicted"
# fingerprints.json: payjoin 1.0.0-rc.3
version = "2"
nsequence = "Rbf"               # 0xFFFFFFFD via Core's walletcreatefundedpsbt (replaceable:
                                  # None passed explicitly, never set by payjoin-cli itself);
                                  # RBF default flip is Core's, see Core v24.0 (archaeology,
                                  # Task 5); #1597 group A
# nlocktime intentionally unset: this reimplements Core's anti-fee-sniping, which is a
# DISTRIBUTIONAL behaviour (locktime == tip height ~90% of the time, backdated up to
# 100 blocks the other ~10%) that a single `AntiFeeSnipe` axis value cannot capture per
# transaction — whether a given transaction used the exact tip or backdated is not
# decidable from that transaction alone. Constraining nlocktime to one value would make
# the template fail on a share of this wallet's own transactions; see `locktime_offset`
# for where this behaviour actually shows up (as a distribution shape, not a label).
# STALE as of payjoin-cli-1.0.0-rc.0 (a0dd291a): payjoin-cli now sets locktime = current tip
# itself (deterministic, no longer Core's distributional anti-fee-sniping) — axis needs re-scoping.
input_order = "Other"            # Core builds the shuffled input vector (GetShuffledInputVector)
sighash = "All"                  # P2WPKH/ECDSA only; sighash_nonall=0 means always SIGHASH_ALL
low_r = "Yes"
uncompressed_pubkey = "No"
op_return = "false"

