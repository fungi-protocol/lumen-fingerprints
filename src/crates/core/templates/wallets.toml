# Wallet fingerprint templates. An omitted axis matches anything.
# confidence: "chain-proven" (decoded from a real txid) or "code-predicted" (read from source).
# Wallet developers: correct your own entry by PR.
# Names match walletfingerprints.info's fingerprints.json so the datasets join; rename in both.
# Era: `software` + `from_version`/`until_version` scope an entry to [from, until); either
# bound may be omitted. Version strings are opaque labels, never ordered. One entry per era.
# Where sources disagree irreconcilably, the axis is left unset (CONFLICT note).

[[wallet]]
name = "payjoin-cli"
software = "payjoin-cli"
from_version = "payjoin-cli-0.0.1-alpha"  # first tagged release
until_version = "payjoin-cli-1.0.0-rc.0"  # a0dd291a starts setting locktime
confidence = "code-predicted"
version = "2"
nsequence = "Rbf"               # Core walletcreatefundedpsbt default since v24.0
# nlocktime unset: Core's randomized backdating crosses the AntiFeeSnipe/Backdated boundary
input_order = "Other"            # Core GetShuffledInputVector
sighash = "All"                  # P2WPKH/ECDSA only
low_r = "Yes"
uncompressed_pubkey = "No"
op_return = "false"

[[wallet]]
name = "payjoin-cli"
software = "payjoin-cli"
from_version = "payjoin-cli-1.0.0-rc.0"
# a0dd291a passes Some(tip height) as locktime, so Core's backdating never runs
confidence = "code-predicted"
version = "2"
nsequence = "Rbf"               # Core walletcreatefundedpsbt default
nlocktime = "AntiFeeSnipe"      # exact tip; confirmations >100 blocks late read Backdated
input_order = "Other"            # Core GetShuffledInputVector
sighash = "All"                  # P2WPKH/ECDSA only
low_r = "Yes"
uncompressed_pubkey = "No"
op_return = "false"

[[wallet]]
name = "ldk-node"
software = "ldk-node"
from_version = "v0.1-alpha"       # single era: no on-chain behaviour change across versions
confidence = "code-predicted"
version = "2"
nsequence = "Rbf"                 # .enable_rbf() through v0.4; bdk_wallet 1.0 RBF default after
nlocktime = "AntiFeeSnipe"        # bdk sets exact chain tip, no backdating; Zero if never synced
input_order = "Other"             # bdk TxOrdering::Shuffle default (0665c9e8)
input_types = "Uniform(P2wpkh)"   # single Bip84 descriptor for both keychains (8bc5c40)
sighash = "All"                   # bdk default (872d55cb)
low_r = "Yes"                     # bdk allow_grinding default (68dd6d20)
uncompressed_pubkey = "No"
op_return = "false"

[[wallet]]
name = "Liana"
software = "liana"
from_version = "0.3rc1"          # hot signer (low_r) first shipped
confidence = "code-predicted"
version = "2"
nsequence = "Rbf"                # spend.rs default since dbf17681; recovery sweeps use older()
# nlocktime unset: Core-style randomized backdating crosses the AntiFeeSnipe/Backdated boundary
input_order = "Other"            # coin-selection order, no sort or shuffle
# input_types unset: wsh vs tr is a per-wallet choice and Uniform(T) can't express either-or
# output_order unset: change-last doesn't fix order; 2-output txs classify by value
low_r = "Yes"                    # HotSigner sign_ecdsa_low_r (f5e7632c); hardware signers vary
uncompressed_pubkey = "No"
op_return = "false"

[[wallet]]
name = "Boltz"
software = "boltz-backend"
until_version = "9af5faa3"       # covers every tag through v3.13.0
confidence = "code-predicted"
version = "2"
# CONFLICT (nsequence): fingerprints.json says 0xFFFFFFFF, rust-payjoin#1597 says 0xFFFFFFFD; unset
# input_order unset: boltz-core 3.1.0 doesn't reorder, but backend's UTXO order is untraced
output_structure = "Single"      # claim/refund: single addOutput, no change
low_r = "No"                     # bitcoinjs ecpair lowR defaults false; flips at 1b93bc79 (untagged)
uncompressed_pubkey = "No"
op_return = "false"

[[wallet]]
name = "Boltz"
software = "boltz-backend"
from_version = "9af5faa3"        # boltz-core v5 bump; untagged, package.json still says 3.13.0
confidence = "code-predicted"
version = "2"
# CONFLICT (nsequence): fingerprints.json says 0xFFFFFFFF, rust-payjoin#1597 says 0xFFFFFFFD; unset
input_order = "Bip69"            # boltz-core compareInputs (d561c8f, v5.0.0)
output_structure = "Single"      # claim/refund: single addOutput, no change
low_r = "Yes"                    # @scure/btc-signer signECDSA lowR=true (boltz-core 8affb59, v4.0.0)
uncompressed_pubkey = "No"
op_return = "false"

[[wallet]]
name = "Bull Bitcoin"
software = "bullbitcoin-mobile"
from_version = "v5.0.0"          # wallet-datasource refactor; all axis cuts land here
confidence = "code-predicted"
version = "2"
# CONFLICT (nsequence): fingerprints.json says 0xFFFFFFFF, rust-payjoin#1597 says 0xFFFFFFFD; unset
nlocktime = "AntiFeeSnipe"       # bdk_wallet exact chain tip, no backdating; Zero if unsynced
