[[wallet]]
name = "Bitcoin Core"
software = "bitcoin-core"
from_version = "v24.0"           # latest of the per-axis cuts below; archaeology (Task 5)
confidence = "code-predicted"
# fingerprints.json: v31.0
version = "2"
nsequence = "Rbf"                 # DEFAULT_WALLET_RBF flipped false->true in PR #25610
                                  # ("wallet, rpc: Opt in to RBF by default"), merged
                                  # 2022-08-01, first shipped v24.0 (commit c5ba1d92b6);
                                  # still false through v23.0 — corrects the brief's
                                  # v0.16.0 hypothesis (archaeology, Task 5)
# nlocktime intentionally unset: Core's anti-fee-sniping is a DISTRIBUTIONAL behaviour
# (locktime == tip height ~90% of the time, backdated up to 100 blocks the other ~10%)
# that a single `AntiFeeSnipe` axis value cannot capture per transaction. Constraining
# nlocktime to one value would make the template fail on a share of Core's own
# transactions; see `locktime_offset` for where this behaviour actually shows up.
input_order = "Other"            # GetShuffledInputVector; shuffle-before-signing landed
                                  # PR #12699 ("Shuffle transaction inputs before signing"),
                                  # merged 2018-03-26, first shipped v0.17.0 (commit
                                  # 2fb9c1e668) — GetShuffledInputVector is a later (PR
                                  # #22019) refactor of the same behaviour, not its origin
                                  # (archaeology, Task 5)
sighash = "All"                  # holds for the default addresstype (bech32/P2WPKH); Core
                                  # can also sign taproot or mix input types under non-default
                                  # config (fingerprints.json hedges single_type as "prefers
                                  # single, mixes"), so input_types is intentionally left unset
low_r = "Yes"                    # PR #13666 ("Always create signatures with Low R values"),
                                  # merged 2018-08-13, first shipped v0.17.0 (commit
                                  # 18dfea0dd0) — confirms the brief's hypothesis
                                  # (archaeology, Task 5)
uncompressed_pubkey = "No"

[[wallet]]
name = "Electrum"
confidence = "code-predicted"    # verified at 4.7.2 in payjoin#1597
version = "2"
nsequence = "Rbf"
# nlocktime intentionally unset: reimplements Core's anti-fee-sniping, which is a
# DISTRIBUTIONAL behaviour (locktime == tip height ~90% of the time, backdated up to
# 100 blocks the other ~10%) that a single `AntiFeeSnipe` axis value cannot capture per
# transaction. Constraining nlocktime to one value would make the template fail on a
# share of Electrum's own transactions; see `locktime_offset` for where this behaviour
# actually shows up.
input_order = "Bip69"
output_order = "Bip69"           # change_position is "BIP-69" here too: BIP-69 fully orders
                                  # the output vector, so (unlike Liana's "last") it genuinely
                                  # constrains output_order, not just change position
low_r = "Yes"
uncompressed_pubkey = "No"

[[wallet]]
name = "Cake Wallet"
software = "cake_wallet"
until_version = "v6.3.0"
confidence = "chain-proven"      # nsequence/nlocktime decoded from prior 9ecd77ab (#1597),
                                  # confirmed 2025-10-25 (block 920749) — predates PR #3379's
                                  # 2026-07-14 merge, so chain-proven confidence anchors here
                                  # (archaeology, Task 3)
# fingerprints.json: bitcoin_base 4.7.0
version = "2"
nsequence = "CakeGroupC"
nlocktime = "Zero"
low_r = "Yes"
uncompressed_pubkey = "No"
input_order = "Bip69"            # was a CONFLICT block: true UNTIL cake-tech/cake_wallet#3379
                                  # ("Shuffle input order on bitcoin sends", merged 2026-07-14,
                                  # first shipped v6.3.0) switched to shuffle — now a fact of
                                  # this closed era (archaeology, Task 3)
# output_order intentionally unset: was a CONFLICT block ("appends change last" vs. #1597's
# struck-through shuffle claim). Archaeology (Task 3) resolved it directly from source: this
# era built with `BitcoinOrdering.none` (construction order, change appended last in code),
# NOT `BitcoinOrdering.bip69` — no BIP-69 sort of the non-change outputs ever ran. Setting
# output_order = "Bip69" would assert a stronger, false claim. And for the common 2-output
# case, OrderClass reads raw value order regardless, so "last" alone cannot map to any
# OrderClass value here either — same reasoning as Liana's entry, above.

[[wallet]]
name = "Cake Wallet"
software = "cake_wallet"
from_version = "v6.3.0"
confidence = "code-predicted"    # post-shuffle era not yet decoded from a real prior
version = "2"
nsequence = "CakeGroupC"         # group-C bug persists across the cut: confirmed UNFIXED on
                                  # both bitcoin_base `main` and the `cake-update-v11` branch
                                  # cake_wallet's pubspec.yaml actually pins (archaeology,
                                  # Task 3) — #3379/#3420/#3432 are ordering changes only, they
                                  # never touch replaceByFeeSequence's inputs[0]-only logic
nlocktime = "Zero"
low_r = "Yes"
uncompressed_pubkey = "No"
input_order = "Other"            # shuffle since cake-tech/cake_wallet#3379 (v6.3.0)
# output_order intentionally unset: output shuffling completes over two releases —
# cake-tech/cake_wallet#3420 (content lands v6.3.0, via an orphaned merge commit resolved by
# content search) covers the software+RBF send paths, #3432 (v6.4.0) finishes hardware
# wallet/Bitcoin Cash sends (archaeology, Task 3). Even fully shuffled, OrderClass reads raw
# value order for the common 2-output case, so this axis stays unset across the whole
# era rather than modeling a third, identically-unconstrained sub-era for v6.3.0–v6.4.0 —
# same over-constraint trap as Liana's entry, above.
