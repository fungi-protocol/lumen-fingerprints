[[wallet]]
name = "BTCPay Server"
software = "btcpayserver"
from_version = "v1.13.0"         # a8fdc4798 removed randomized RBF
confidence = "code-predicted"
# tx_version, nlocktime, low_r unset: fingerprints.json marks them sampled
nsequence = "Rbf"                # NBXplorer OptInRBF; btcpayserver sends RBF=true
input_order = "Other"            # NBitcoin TransactionBuilder.ShuffleInputs default
uncompressed_pubkey = "No"
op_return = "false"

[[wallet]]
name = "Bitcoin Core"
software = "bitcoin-core"
from_version = "v24.0"           # RBF default (PR #25610)
confidence = "code-predicted"
version = "2"
nsequence = "Rbf"                 # DEFAULT_WALLET_RBF true since PR #25610 (v24.0)
# nlocktime unset: randomized backdating crosses the AntiFeeSnipe/Backdated boundary
input_order = "Other"             # inputs shuffled before signing (PR #12699, v0.17.0)
sighash = "All"                  # default addresstype; taproot under non-default config
input_types = ["Uniform(P2wpkh)", "Uniform(P2tr)", "Uniform(P2pkh)", "Uniform(P2sh)", "Uniform(P2wsh)", "Mixed"]
                                  # spends any held type, never bare P2PK or NonStandard
low_r = "Yes"                    # PR #13666 (v0.17.0)
uncompressed_pubkey = "No"

[[wallet]]
name = "Electrum"
software = "electrum"
from_version = "4.0.0b0"         # low-R grinding (d16fd2783)
confidence = "code-predicted"
version = "2"
nsequence = "Rbf"                 # wallet.py rbf=True default since 3.1.0
# nlocktime unset: Core-style randomized backdating crosses the AntiFeeSnipe/Backdated boundary
input_order = "Bip69"            # BIP69_sort default (98bea614d); only LN sweep batching opts out
output_order = "Bip69"           # same sort orders the full output vector
low_r = "Yes"                    # electrum_ecc ENABLE_ECDSA_R_VALUE_GRINDING default
uncompressed_pubkey = "No"

