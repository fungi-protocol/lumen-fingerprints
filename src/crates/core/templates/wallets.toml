until_version = "9af5faa3"       # open era, no from_version: covers every tagged release
                                  # up to and including v3.13.0 (fingerprints.json's own
                                  # pin, still boltz-backend's newest tag) — see the sibling
                                  # entry below for why the cut is a commit, not a tag
confidence = "code-predicted"
# fingerprints.json: boltz-backend 3.13.0
version = "2"
# CONFLICT (nsequence): fingerprints.json gives "0xFFFFFFFF (MAX)", but #1597's opening
# comment places Boltz in "group A - uniformly 0xFFFFFFFD", and its own follow-up EDIT
# explains the old MAX reading was Boltz's *payjoin-contributed* input, which the lib
# overwrites with the sender's sequence before it ever reaches chain
# (receive/common/mod.rs:285-317) — Boltz's own (non-payjoin) txs use 0xFFFFFFFD. Two
# irreconcilable values from the same research thread; left unset rather than guessed.
# input_order intentionally unset: at the boltz-core 3.1.0 pin in place through v3.13.0,
# constructClaimTransaction already takes `utxos: ClaimDetails[]` (plural — multi-input
# claims pre-date the BIP-69 patch) and iterates with a plain `utxos.forEach(...)`, no
# sort/shuffle call anywhere in Claim.ts (`git show v3.1.0:lib/swap/Claim.ts | grep -i
# sort` — empty). But that only proves boltz-core's own code doesn't reorder; the actual
# order is whatever boltz-backend's UTXO-selection code passes in, which was not traced
# here (out of scope: lives in boltz-backend's own swap-claiming logic, not the boltz-core
# dependency this task audited). Labelling it "Other" would assert a specific OrderClass
# outcome for an upstream ordering this task didn't inspect — same over-constraint trap as
# Liana's output_order (archaeology, Task 8) and Cake Wallet's output_order (Task 3), both
# elsewhere in this file. archaeology (Task 9)
output_structure = "Single"      # claim/refund: a single `tx.addOutput(destinationScript,
                                  # ...)`, no change output — the only addOutput call in
                                  # constructClaimTransaction, at this pin and at HEAD alike
                                  # (true since boltz-core's first tag v0.0.1); spans both
                                  # Boltz eras in this file. archaeology (Task 9)
