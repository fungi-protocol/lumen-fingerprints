                                  # f5e7632c ("signer: expose a method for signing a PSBT",
                                  # 2023-01-26) — the hot signer module didn't exist at all
                                  # before this (0.0.1-0.2rc1 shipped hardware-wallet signing
                                  # only), first shipped 0.3rc1, still the call site at v14.0
                                  # (signer.rs:273). CAVEAT: Liana also supports signing via
                                  # hardware wallets (async-hwi crate, a GUI dependency since
                                  # 0.0.1 and still present at v14.0) — for hardware-signed
                                  # spends, low-R grinding is the external device's firmware
                                  # behaviour, not Liana's own code, at every version
                                  # (archaeology, Task 8)
uncompressed_pubkey = "No"
op_return = "false"

