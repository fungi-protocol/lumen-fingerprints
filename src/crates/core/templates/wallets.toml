                                  # (ECPairInterface.sign(sigHash), no second argument) —
                                  # `ECPair.lowR` defaults false at construction
                                  # (ts_src/ecpair.ts:195) and is never set true anywhere in
                                  # boltz-core's or boltz-backend's history (`git log --all
                                  # -S '.lowR'` and `-S 'lowR:'` both empty in both repos) —
                                  # grinding was off. archaeology (Task 9)
                                  # NOTE: low_r actually flipped to Yes at commit 1b93bc79
                                  # (2026-05-19), three days before this era's cut at 9af5faa3
                                  # (2026-05-22) — a master-tracking deployment in that untagged
                                  # window is misdescribed on this axis; no tagged release lands there.
uncompressed_pubkey = "No"
op_return = "false"

