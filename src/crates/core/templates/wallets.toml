# fingerprints.json: bitcoin_base 4.7.0
version = "2"
nsequence = "CakeGroupC"
nlocktime = "Zero"
low_r = "Yes"
uncompressed_pubkey = "No"
# CONFLICT (input_order): fingerprints.json's input_ordering is "BIP-69", matching the
